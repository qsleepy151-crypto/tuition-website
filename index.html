<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightPath Tuition</title>
<style>
:root{--navy:#C4B5FD;--blue:#A78BFA;--bg:#FFF7FB;--ink:#374151;--muted:#8B91A0;--white:#FFFFFF}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#C4B5FD,#F9C5D5);color:#374151;padding:28px 20px}header .wrap{max-width:1100px;margin:auto}h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}header p{margin:8px 0 0;color:#dbeafe}
main{max-width:1100px;margin:26px auto;padding:0 16px}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #0f172a0c;margin-bottom:20px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.role{padding:22px;border:1px solid #e2e8f0;border-radius:16px;background:white;text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}.role:hover{border-color:var(--blue);transform:translateY(-2px)}.role h2{margin:8px 0}.role p{color:var(--muted);margin:0}.emoji{font-size:2rem}
button{border:0;border-radius:10px;background:#A78BFA;color:white;font-weight:700;padding:12px 16px;cursor:pointer}button.secondary{background:#e2e8f0;color:var(--ink)}button.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}textarea{min-height:80px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.muted{color:var(--muted)}.subjectgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.subject{background:#F3E8FF;padding:10px;border-radius:10px}.subject input{width:auto}
.item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.item h3{margin:0 0 6px}.tag{display:inline-block;background:#dbeafe;color:#1e40af;padding:4px 9px;border-radius:99px;font-size:.8rem;margin:2px}
footer{text-align:center;color:var(--muted);padding:24px}.notice{background:#fffbeb;padding:12px;border-radius:10px;color:#92400e;font-size:.92rem}.success{background:#ecfdf5;color:#065f46;padding:12px;border-radius:10px}.error{background:#fef2f2;color:#991b1b;padding:12px;border-radius:10px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.status{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:700}.status-approved{background:#dcfce7;color:#166534}.status-rejected{background:#fee2e2;color:#991b1b}.status-pending{background:#fef3c7;color:#92400e}
.child-entry{margin-top:14px}.child-entry h3{margin-bottom:10px}.admin-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.admin-column{min-width:0}.schedule-card{background:#F8F2FF;border:1px solid #E9D5FF;border-radius:14px;padding:14px;margin:10px 0}@media(max-width:700px){.admin-columns{grid-template-columns:1fr}}
.admin-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.admin-column{min-width:0;border:1px solid #e2e8f0;border-radius:14px;padding:16px;background:#fafbff}
.admin-column>h3{margin-top:0;padding-bottom:10px;border-bottom:1px solid #e2e8f0}
@media(max-width:760px){.admin-columns{grid-template-columns:1fr}}


.excel-import{background:#eef6ff;border:1px solid #bfdbfe;border-radius:14px;padding:16px;margin:18px 0}
</style>
</head>
<body>
<header><div class="wrap"><h1>SIAH's Tuition</h1><p>Belajar Molek Belaka deh...</p></div></header>
<main>
<section id="home" class="panel"><h2>Welcome! Choose your portal</h2><p class="muted">Choose how you'd like to use the tuition platform.</p>
<div class="roles">
<button class="role" onclick="showPortal('tutor')"><div class="emoji">👩‍🏫</div><h2>Tutor</h2><p>Register, manage subjects and view teaching schedules.</p></button>
<button class="role" onclick="showPortal('parent')"><div class="emoji">👨‍👩‍👧</div><h2>Parents</h2><p>Register your children and manage tuition requests.</p></button>
<button class="role" onclick="showPortal('admin')"><div class="emoji">🛡️</div><h2>Admin</h2><p>Moderate registrations and manage the platform.</p></button>
</div></section>
<section id="portal" class="panel hidden"><div class="actions"><button class="secondary" onclick="goHome()">← Back</button></div><h2 id="portalTitle"></h2><div id="portalContent"></div></section>
<section class="panel"><h2>Subjects</h2><div class="subjectgrid" id="subjectDisplay"></div></section>
</main><footer>BrightPath Tuition</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, updateDoc, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBDuD8LloKpKvJwdxOptXaamr0KjaQJyng",authDomain:"brightpath-tuition-c240b.firebaseapp.com",projectId:"brightpath-tuition-c240b",storageBucket:"brightpath-tuition-c240b.firebasestorage.app",messagingSenderId:"869976922467",appId:"1:869976922467:web:b88ab6c024e64ec7fe5b56"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const ADMIN_EMAIL="qsleepy151@gmail.com";
const subjects=['Malay','English','Mathematics','Additional Mathematics','History','Pendidikan Islam','Geography','Science','Biology','Chemistry','Physics'];
document.getElementById('subjectDisplay').innerHTML=subjects.map(s=>`<div class="subject">${s}</div>`).join('');
let currentRole='';
const portalContent=document.getElementById('portalContent');
function msg(text,type='notice'){const el=document.getElementById('message');if(el){el.className=type;el.textContent=text;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function formatExcelTime(value){
  if(typeof value === 'number'){
    const totalMinutes = Math.round(value * 24 * 60);
    const hours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;
    const h12 = hours % 12 || 12;
    return `${h12}:${String(minutes).padStart(2,'0')} ${hours >= 12 ? 'PM' : 'AM'}`;
  }
  return String(value || '');
}
function statusBadge(status){const cls=String(status||'Pending').toLowerCase();return `<span class="status status-${esc(cls)}">${esc(status||'Pending')}</span>`;}
window.showPortal=(role)=>{currentRole=role;document.getElementById('home').classList.add('hidden');document.getElementById('portal').classList.remove('hidden');document.getElementById('portalTitle').textContent={tutor:'Tutor Portal',parent:'Parent Portal',admin:'Admin Moderator'}[role];if(role==='admin')adminView();else userView(role);};
window.goHome=()=>{document.getElementById('portal').classList.add('hidden');document.getElementById('home').classList.remove('hidden');};
function userView(role){
 const isTutor=role==='tutor';
 const fields=isTutor?`
 <label>Full name</label><input id="name" required>
 <label>Email</label><input id="email" type="email" required>
 <label>Phone</label><input id="phone">
 <label>Subjects you teach</label><div class="subjectgrid">${subjects.map(s=>`<label class="subject"><input type="checkbox" name="sub" value="${s}"> ${s}</label>`).join('')}</div>
 <label>Availability / schedule</label><textarea id="schedule"></textarea><label>Short introduction</label><textarea id="bio"></textarea>`:`
 <label>Parent / guardian name</label><input id="name" required>
 <label>Email</label><input id="email" type="email" required>
 <label>Phone</label><input id="phone">
 <div id="childrenContainer"><div class="child-entry item"><h3>Child 1</h3>
 <label>Child's name</label><input class="childName" required>
 <label>Child's age / school year</label><input class="childAge">
 <label>Subjects needed</label><div class="subjectgrid">${subjects.map(s=>`<label class="subject"><input type="checkbox" class="childSubject" value="${s}"> ${s}</label>`).join('')}</div>
 <label>Preferred schedule</label><textarea class="childSchedule"></textarea></div></div>
 <button type="button" class="secondary" id="addChildBtn">+ Add another child</button>`;
 portalContent.innerHTML=`<div class="notice">Create an account using your email and password. Your registration will be stored in Firebase and marked Pending for admin review.</div><h3>Register</h3>
 <form id="regForm"><div>${fields}<label>Password (minimum 6 characters)</label><input id="password" type="password" minlength="6" required></div><div class="actions"><button type="submit">Create account & submit registration</button></div></form>
 <hr><h3>Already registered? Sign in</h3><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" required><label>Password</label><input id="loginPassword" type="password" required><div class="actions"><button type="submit">Sign in</button></div></form><p><button type="button" class="secondary" id="forgotPasswordBtn">Forgot Password?</button></p><div id="message"></div><div id="myList"></div>`;
 if(!isTutor){let childCount=1;document.getElementById('addChildBtn').onclick=()=>{childCount++;const div=document.createElement('div');div.className='child-entry item';div.innerHTML=`<h3>Child ${childCount}</h3><label>Child's name</label><input class="childName" required><label>Child's age / school year</label><input class="childAge"><label>Subjects needed</label><div class="subjectgrid">${subjects.map(s=>`<label class="subject"><input type="checkbox" class="childSubject" value="${s}"> ${s}</label>`).join('')}</div><label>Preferred schedule</label><textarea class="childSchedule"></textarea>`;document.getElementById('childrenContainer').appendChild(div);};}
 document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{
 const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;
 let payload={uid:null,role,name:document.getElementById('name').value.trim(),email,phone:document.getElementById('phone').value.trim(),status:'Pending',createdAt:serverTimestamp()};
 if(isTutor){payload.subjects=[...document.querySelectorAll('input[name="sub"]:checked')].map(x=>x.value);payload.schedule=document.getElementById('schedule').value.trim();payload.bio=document.getElementById('bio').value.trim();}
 else{payload.children=[...document.querySelectorAll('.child-entry')].map(div=>({name:div.querySelector('.childName').value.trim(),age:div.querySelector('.childAge').value.trim(),subjects:[...div.querySelectorAll('.childSubject:checked')].map(x=>x.value),schedule:div.querySelector('.childSchedule').value.trim()}));}
 const cred=await createUserWithEmailAndPassword(auth,email,password);payload.uid=cred.user.uid;await addDoc(collection(db,'registrations'),payload);
 msg('Account created and registration submitted. Status: Pending.','success');await renderMine();
 }catch(err){msg(errorText(err),'error');}finally{btn.disabled=false;}};
 document.getElementById('forgotPasswordBtn').onclick=async()=>{const email=document.getElementById('loginEmail').value.trim();if(!email){msg('Please enter your email address above first.','error');return;}try{await sendPasswordResetEmail(auth,email);msg('Password reset email sent. Please check your inbox (and spam folder).','success');}catch(err){msg(errorText(err),'error');}};
 document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{const cred=await signInWithEmailAndPassword(auth,document.getElementById('loginEmail').value.trim(),document.getElementById('loginPassword').value);if(cred.user.email.toLowerCase()===ADMIN_EMAIL){await signOut(auth);msg('This is the admin account. Please use the Admin portal.','error');return;}await renderMine();msg('Signed in.','success');}catch(err){msg(errorText(err),'error');}};
}
async function renderMine(){
 const el=document.getElementById('myList');if(!el||!auth.currentUser)return;
 try{
  const snap=await getDocs(query(collection(db,'registrations'),where('uid','==',auth.currentUser.uid)));
  const docs=snap.docs;
  let html='<h3>Your dashboard</h3>';
  for(const d of docs){
   const r=d.data();
   if(r.role==='parent'){
    html+=`<div class="item"><h3>Parent account · ${esc(r.name)}</h3><p class="muted">${esc(r.email)}</p>`;
    (r.children||[]).forEach((c,i)=>{html+=`<div class="item"><h4>${esc(c.name)} ${c.age?`(${esc(c.age)})`:''} · ${statusBadge(c.status||r.status||'Pending')}</h4><p>Subjects: ${(c.subjects||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'None selected'}</p><p>Registration preference: ${esc(c.schedule||'Not specified')}</p></div>`;});
    html+='</div>';
   }else{
    html+=`<div class="item"><h3>Tutor profile · ${esc(r.name)} · ${statusBadge(r.status)}</h3><p>${esc(r.email)}</p><p>Subjects: ${(r.subjects||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'None selected'}</p><p>Availability: ${esc(r.schedule||'Not specified')}</p><p>${esc(r.bio||'')}</p></div>`;
   }
  }
  const schedSnap=await getDocs(query(collection(db,'schedules'),where('parentUid','==',auth.currentUser.uid)));
  if(!schedSnap.empty){
   html+='<h3>Upcoming tuition schedule</h3>';
   schedSnap.docs.forEach(sd=>{const s=sd.data();html+=`<div class="schedule-card"><h4>${esc(s.childName)} · ${esc(s.subject)}</h4><p><strong>${esc(s.day||s.date||'')}</strong> · ${esc(s.startTime||'')} – ${esc(s.endTime||'')}</p><p>Tutor: ${esc(s.tutorName||s.tutorEmail||'Not assigned')}</p><p>${esc(s.location||'')}</p><p>${esc(s.notes||'')}</p></div>`;});
  }else html+='<h3>Upcoming tuition schedule</h3><p class="muted">No lessons have been scheduled yet.</p>';
  if(docs.some(d=>d.data().role==='parent')){
   const reports=await getDocs(query(collection(db,'reports'),where('parentUid','==',auth.currentUser.uid)));
   if(!reports.empty){html+='<h3>Teacher class reports</h3>';reports.docs.forEach(rd=>{const q=rd.data();html+=`<div class="item"><h4>${esc(q.childName)} · ${esc(q.subject)} · ${esc(q.lessonDate||q.day||'')}</h4><p><strong>Topics:</strong> ${esc(q.topics||'')}</p><p><strong>Progress:</strong> ${esc(q.progress||'')}</p><p><strong>Homework:</strong> ${esc(q.homework||'')}</p><p><strong>Improve:</strong> ${esc(q.improve||'')}</p><p><strong>Next lesson:</strong> ${esc(q.nextPlan||'')}</p><p><strong>Tutor:</strong> ${esc(q.tutorName||q.tutorEmail||'')}</p></div>`;});}
  }else{
   const tutorSched=await getDocs(query(collection(db,'schedules'),where('tutorEmail','==',auth.currentUser.email.toLowerCase())));
   html+='<h3>Assigned lessons & class reports</h3>';
   tutorSched.docs.forEach(sd=>{const s=sd.data();html+=`<div class="item"><h4>${esc(s.childName)} · ${esc(s.subject)}</h4><p>${esc(s.day||'')} · ${esc(s.startTime||'')}–${esc(s.endTime||'')}</p><p>Parent: ${esc(s.parentDocId||'')}</p><form class="reportForm" data-schedule="${sd.id}" data-parentuid="${esc(s.parentUid||'')}" data-child="${esc(s.childName||'')}" data-subject="${esc(s.subject||'')}" data-day="${esc(s.day||'')}"><label>Lesson date</label><input name="lessonDate" type="date"><label>Topics covered</label><textarea name="topics" required></textarea><label>Student progress</label><textarea name="progress"></textarea><label>Homework</label><textarea name="homework"></textarea><label>Areas to improve</label><textarea name="improve"></textarea><label>Next lesson plan</label><textarea name="nextPlan"></textarea><button type="submit">Submit report</button></form></div>`;});
   html+='<div id="reportMessage"></div>';
  }
  el.innerHTML=html+`<div class="actions"><button class="secondary" onclick="logout()">Sign out</button></div>`;
  document.querySelectorAll('.reportForm').forEach(f=>f.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(f);try{await addDoc(collection(db,'reports'),{scheduleId:f.dataset.schedule,parentUid:f.dataset.parentuid,childName:f.dataset.child,subject:f.dataset.subject,day:f.dataset.day,lessonDate:fd.get('lessonDate'),topics:fd.get('topics'),progress:fd.get('progress'),homework:fd.get('homework'),improve:fd.get('improve'),nextPlan:fd.get('nextPlan'),tutorName:auth.currentUser.displayName||'',tutorEmail:auth.currentUser.email,createdAt:serverTimestamp()});f.reset();const m=document.getElementById('reportMessage');if(m)m.innerHTML='<div class="success">Report submitted!</div>';}catch(err){const m=document.getElementById('reportMessage');if(m)m.innerHTML='<div class="error">'+esc(errorText(err))+'</div>';}});
 }catch(e){el.textContent=errorText(e);}
}
window.logout=async()=>{await signOut(auth);goHome();};
function adminView(){portalContent.innerHTML=`<div class="notice">Sign in with the designated admin account to moderate registrations.</div><form id="adminLogin"><label>Admin email</label><input id="adminEmail" type="email" required value="${ADMIN_EMAIL}"><label>Password</label><input id="adminPassword" type="password" required><div class="actions"><button type="submit">Sign in as admin</button></div></form><div id="message"></div><div id="adminData"></div>`;
document.getElementById('adminLogin').onsubmit=async e=>{e.preventDefault();try{const email=document.getElementById('adminEmail').value.trim().toLowerCase();if(email!==ADMIN_EMAIL){msg('This email is not the designated admin account.','error');return;}await signInWithEmailAndPassword(auth,email,document.getElementById('adminPassword').value);await loadAdmin();}catch(err){msg(errorText(err),'error');}};}
async function loadAdmin(){
 const el=document.getElementById('adminData');
 try{
  const snap=await getDocs(query(collection(db,'registrations'),orderBy('createdAt','desc')));
  const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  const tutors=rows.filter(r=>r.role==='tutor'),parents=rows.filter(r=>r.role==='parent');
  const tutorCards=tutors.map(r=>`<div class="item"><h3>Tutor · ${esc(r.name)} · ${statusBadge(r.status)}</h3><p>${esc(r.email)} · ${esc(r.phone||'')}</p><p>Subjects: ${(r.subjects||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'None selected'}</p><p>Availability: ${esc(r.schedule||'Not specified')}</p><p>Introduction: ${esc(r.bio||'')}</p><div class="actions"><button onclick="setStatus('${r.id}','Approved')">Approve</button><button class="secondary" onclick="setStatus('${r.id}','Rejected')">Reject</button><button class="danger" onclick="deleteRecord('${r.id}')">Delete</button></div></div>`).join('')||'<p>No tutor registrations yet.</p>';
  const parentCards=parents.map(r=>`<div class="item"><h3>Parent · ${esc(r.name)}</h3><p>${esc(r.email)} · ${esc(r.phone||'')}</p>${(r.children||[]).map((c,i)=>`<div class="item"><h4>${i+1}. ${esc(c.name)} ${c.age?`(${esc(c.age)})`:''} · ${statusBadge(c.status||r.status||'Pending')}</h4><p>Subjects: ${(c.subjects||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')||'None selected'}</p><p>Registration preference: ${esc(c.schedule||'Not specified')}</p><div class="actions"><button onclick="setChildStatus('${r.id}',${i},'Approved')">Approve</button><button class="secondary" onclick="setChildStatus('${r.id}',${i},'Rejected')">Reject</button></div></div>`).join('')}<div class="actions"><button class="danger" onclick="deleteRecord('${r.id}')">Delete registration</button></div></div>`).join('')||'<p>No parent registrations yet.</p>';
  el.innerHTML=`<section class="excel-import"><h3>📥 Import Excel data</h3><p>Upload the BrightPath Excel template to import parent/child records, tutors, class schedules and payments. Existing parent accounts are matched by email.</p><input id="excelFile" type="file" accept=".xlsx,.xls"><div class="actions"><button type="button" id="importExcelBtn">Import Excel</button></div><div id="importResult"></div></section><h3>Registrations (${rows.length})</h3><div class="admin-columns"><section class="admin-column"><h3>👩‍🏫 Tutors (${tutors.length})</h3>${tutorCards}</section><section class="admin-column"><h3>👨‍👩‍👧 Parents (${parents.length})</h3>${parentCards}</section></div><hr><section class="panel"><h3>📅 Create a tuition schedule</h3><p class="muted">Assign a lesson to a parent’s child. The schedule will appear in that parent's dashboard.</p><form id="scheduleForm"><label>Parent</label><select id="scheduleParent" required><option value="">Select a parent</option>${parents.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.email)}</option>`).join('')}</select><label>Child</label><select id="scheduleChild" required><option value="">Select parent first</option></select><div class="formgrid"><div><label>Subject</label><select id="scheduleSubject" required>${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Day or date</label><input id="scheduleDay" placeholder="e.g. Monday or 28 Nov" required></div><div><label>Start time</label><input id="scheduleStart" type="time" required></div><div><label>End time</label><input id="scheduleEnd" type="time" required></div><div><label>Tutor name</label><input id="scheduleTutor"></div><div><label>Tutor email (optional)</label><input id="scheduleTutorEmail" type="email"></div><div><label>Location / online link</label><input id="scheduleLocation" placeholder="Classroom or meeting link"></div></div><label>Notes</label><textarea id="scheduleNotes"></textarea><div class="actions"><button type="submit">Save schedule</button></div></form><div id="scheduleList"></div></section><div class="actions"><button class="secondary" onclick="logout()">Sign out</button></div>`;

  document.getElementById('importExcelBtn').onclick=async()=>{
    const file=document.getElementById('excelFile').files[0],out=document.getElementById('importResult'),btn=document.getElementById('importExcelBtn');
    if(!file){out.innerHTML='<p class="error">Please choose your Excel file first.</p>';return;}
    btn.disabled=true;out.textContent='Reading Excel file...';
    try{
      const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
      const book=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const rowsOf=name=>book.Sheets[name]?XLSX.utils.sheet_to_json(book.Sheets[name],{defval:''}):[];
      const norm=x=>String(x||'').trim().toLowerCase();
      const parentRows=rowsOf('Parents & Children'), tutorRows=rowsOf('Tutors'), scheduleRows=rowsOf('Class Schedule'), paymentRows=rowsOf('Payments');
      let counts={parents:0,tutors:0,schedules:0,payments:0,skippedSchedules:0,skippedPayments:0};
      // Parents: aggregate children by email, match registered parent accounts where possible.
      const grouped={};
      for(const row of parentRows){
        const email=norm(row['Parent Email']);if(!email)continue;
        if(!grouped[email])grouped[email]={name:String(row['Parent Name']||'').trim(),phone:String(row['Parent Phone']||'').trim(),email,children:[]};
        const name=String(row['Child Name']||'').trim();if(!name)continue;
        grouped[email].children.push({name,age:String(row['Child Age']||'').trim(),school:String(row['School']||'').trim(),subjects:String(row['Subjects Needed']||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean),schedule:String(row['Notes']||'').trim(),status:String(row['Registration Status']||'Pending').trim()||'Pending'});
      }
      for(const p of Object.values(grouped)){
        const existing=await getDocs(query(collection(db,'registrations'),where('email','==',p.email)));
        if(!existing.empty){
          const d=existing.docs.find(x=>x.data().role==='parent')||existing.docs[0],data=d.data();
          const merged=[...(data.children||[])];
          for(const c of p.children){const idx=merged.findIndex(x=>norm(x.name)===norm(c.name));if(idx>=0)merged[idx]={...merged[idx],...c};else merged.push(c);}
          await updateDoc(doc(db,'registrations',d.id),{name:p.name||data.name,phone:p.phone||data.phone,children:merged});
        }else{
          await addDoc(collection(db,'registrations'),{uid:null,role:'parent',name:p.name,email:p.email,phone:p.phone,status:'Pending',children:p.children,createdAt:serverTimestamp(),importedFromExcel:true});
        }counts.parents++;
      }
      // Tutors: match by email or create admin-visible imported registration record.
      for(const t of tutorRows){
        const email=norm(t['Tutor Email']);if(!email)continue;
        const payload={role:'tutor',name:String(t['Tutor Name']||'').trim(),email,phone:String(t['Phone']||'').trim(),subjects:String(t['Subjects']||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean),schedule:String(t['Availability']||'').trim(),bio:String(t['Notes']||'').trim(),status:String(t['Status']||'Pending').trim(),importedFromExcel:true};
        const existing=await getDocs(query(collection(db,'registrations'),where('email','==',email)));
        if(existing.empty)await addDoc(collection(db,'registrations'),{...payload,uid:null,createdAt:serverTimestamp()});
        else {const d=existing.docs.find(x=>x.data().role==='tutor')||existing.docs[0];await updateDoc(doc(db,'registrations',d.id),payload);}
        counts.tutors++;
      }
      // Schedules: match parent email to a parent registration. Imported records without an Auth UID are admin-visible only.
      for(const s of scheduleRows){
        const email=norm(s['Parent Email']),child=String(s['Child Name']||'').trim();if(!email||!child)continue;
        const found=await getDocs(query(collection(db,'registrations'),where('email','==',email)));
        const pdoc=found.docs.find(x=>x.data().role==='parent');if(!pdoc){counts.skippedSchedules++;continue;}
        const p=pdoc.data(),childObj=(p.children||[]).find(x=>norm(x.name)===norm(child));
        await addDoc(collection(db,'schedules'),{parentUid:p.uid||null,parentDocId:pdoc.id,childIndex:(p.children||[]).findIndex(x=>norm(x.name)===norm(child)),childName:child,subject:String(s['Subject']||''),day:String(s['Day / Date']||''),startTime:formatExcelTime(s['Start Time']),endTime:formatExcelTime(s['End Time']),tutorName:String(s['Tutor Name']||''),tutorEmail:norm(s['Tutor Email']),location:String(s['Location / Online Link']||''),notes:String(s['Notes']||''),createdAt:serverTimestamp(),importedFromExcel:true});counts.schedules++;
      }
      for(const p of paymentRows){
        if(!String(p['Parent Email']||'').trim()){counts.skippedPayments++;continue;}
        await addDoc(collection(db,'payments'),{parentEmail:norm(p['Parent Email']),childName:String(p['Child Name']||''),description:String(p['Subject / Description']||''),amount:String(p['Amount (RM)']||''),dueDate:String(p['Due Date']||''),paymentDate:String(p['Payment Date']||''),status:String(p['Payment Status']||'Pending'),notes:String(p['Notes']||''),createdAt:serverTimestamp(),importedFromExcel:true});counts.payments++;
      }
      out.innerHTML=`<div class="success">Import finished. Parents updated/created: ${counts.parents}; tutors updated/created: ${counts.tutors}; schedules saved: ${counts.schedules}; schedules skipped (parent email not found): ${counts.skippedSchedules}; payments saved: ${counts.payments}; payment rows skipped (missing parent email): ${counts.skippedPayments}. Imported parent records without an account UID are Admin-only until the parent registers/signs in.</div>`;
      await loadAdmin();
    }catch(err){out.innerHTML='<div class="error">Import failed: '+esc(err.message||err)+'</div>';}
    finally{btn.disabled=false;}
  };
  const parentSelect=document.getElementById('scheduleParent'),childSelect=document.getElementById('scheduleChild');
  parentSelect.onchange=()=>{const p=parents.find(x=>x.id===parentSelect.value);childSelect.innerHTML=p?(p.children||[]).map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join(''):'<option value="">Select parent first</option>';};
  document.getElementById('scheduleForm').onsubmit=async ev=>{ev.preventDefault();const p=parents.find(x=>x.id===parentSelect.value),idx=Number(childSelect.value),c=p?.children?.[idx];if(!p||!c)return;try{await addDoc(collection(db,'schedules'),{parentUid:p.uid,parentDocId:p.id,childIndex:idx,childName:c.name,subject:document.getElementById('scheduleSubject').value,day:document.getElementById('scheduleDay').value,startTime:document.getElementById('scheduleStart').value,endTime:document.getElementById('scheduleEnd').value,tutorName:document.getElementById('scheduleTutor').value.trim(),tutorEmail:document.getElementById('scheduleTutorEmail').value.trim().toLowerCase(),location:document.getElementById('scheduleLocation').value.trim(),notes:document.getElementById('scheduleNotes').value.trim(),createdAt:serverTimestamp()});ev.target.reset();childSelect.innerHTML='<option value="">Select parent first</option>';msg('Schedule saved.','success');await loadAdmin();}catch(err){msg(errorText(err),'error');}};
  await renderScheduleList();
  msg('Admin signed in.','success');
 }catch(err){msg(errorText(err),'error');}
}
async function renderScheduleList(){
 const el=document.getElementById('scheduleList');if(!el)return;
 try{const snap=await getDocs(collection(db,'schedules'));el.innerHTML='<h3>Saved schedules</h3>'+snap.docs.map(d=>{const s=d.data();return `<div class="item"><h4>${esc(s.childName)} · ${esc(s.subject)}</h4><p>${esc(s.day)} · ${esc(s.startTime)} – ${esc(s.endTime)}</p><p>Tutor: ${esc(s.tutorName||s.tutorEmail||'')}</p><div class="actions"><button class="danger" onclick="deleteSchedule('${d.id}')">Delete schedule</button></div></div>`;}).join('')||'<p>No schedules saved yet.</p>';}catch(e){el.textContent=errorText(e);}
}
window.deleteSchedule=async(id)=>{if(confirm('Delete this schedule?')){try{await deleteDoc(doc(db,'schedules',id));await renderScheduleList();}catch(e){msg(errorText(e),'error');}}};
window.setStatus=async(id,status)=>{try{await updateDoc(doc(db,'registrations',id),{status});await loadAdmin();}catch(e){msg(errorText(e),'error');}};
window.setChildStatus=async(id,index,status)=>{try{const ref=doc(db,'registrations',id);const snap=await getDocs(query(collection(db,'registrations'),where('__name__','==',id)));if(snap.empty)throw new Error('Registration not found.');const data=snap.docs[0].data();const children=[...(data.children||[])];if(!children[index])throw new Error('Child not found.');children[index]={...children[index],status};await updateDoc(ref,{children});await loadAdmin();}catch(e){msg(errorText(e),'error');}};
window.deleteRecord=async(id)=>{if(confirm('Delete this registration?')){try{await deleteDoc(doc(db,'registrations',id));await loadAdmin();}catch(e){msg(errorText(e),'error');}}};
function errorText(e){const code=e?.code||'';return code==='auth/email-already-in-use'?'That email already has an account. Please use the sign-in form.':code==='auth/invalid-credential'?'Email or password is incorrect.':code==='auth/weak-password'?'Password must be at least 6 characters.':code==='permission-denied'?'Firebase denied this action. Check that the rules are published and the admin document role is exactly admin.':e?.message||'Something went wrong.';}
</script></body></html>
